name: coffee_pos_app
description: "A new Flutter project for Coffee Shop POS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # 1. State Management
  provider: ^6.1.2

  # 2. Database Lokal (SQLite)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # 3. Export Excel & File Management
  excel: ^4.0.3
  path_provider: ^2.1.3
  share_plus: ^9.0.0

  # 4. Bluetooth Thermal Printer
  blue_thermal_printer: ^1.2.3
  # 5. UI, Visualisasi, & Formatter
  fl_chart: ^0.68.0
  intl: ^0.19.0
  esc_pos_utils_plus: ^2.0.4
  sqflite_common_ffi: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Konfigurasi folder assets (gambar logo, gambar QRIS statis, dsb.)
  assets:
    - assets/images/
    - assets/icons/